name: test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: published bench must stay correct
        run: python bench/bench.py
      - name: examples hierarchy must lint clean
        run: python scripts/agentsmd lint --root examples
      - name: broken fixture must exit 1
        run: python scripts/agentsmd lint --root bench/fixtures/nopath || test $? -eq 1
      - name: effective must compile the child chain
        run: python scripts/agentsmd effective examples/services/api --root examples
